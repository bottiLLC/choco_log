<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-28 select-none">
    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
            <h1 class="text-xl font-bold tracking-wide text-amber-400">CHOCO LOG</h1>
            <span v-if="loading" class="text-xs text-slate-400 animate-pulse">読込中...</span>
        </header>

        <div v-if="loading" class="text-center py-20 text-slate-500">
            マスター読み込み中...
        </div>

        <!-- 種目カード一覧 -->
        <div v-else class="space-y-4">
            <div v-for="(item, idx) in items" :key="item.name" :class="{'opacity-40': !item.active}"
                class="bg-slate-800 border border-slate-700 rounded-xl p-4 transition-all">

                <div class="flex justify-between items-center mb-3">
                    <span class="font-bold text-lg">{{ item.name }}</span>
                    <button @click="item.active = !item.active"
                        :class="item.active ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-400'"
                        class="px-3 py-1 rounded text-xs transition">
                        {{ item.active ? 'やる' : 'パス' }}
                    </button>
                </div>

                <div v-if="item.active" class="space-y-3">
                    <!-- モード切替（両足/片足など） -->
                    <div v-if="item.modes.length" class="flex gap-2">
                        <button v-for="m in item.modes" :key="m" @click="item.selectedMode = m"
                            :class="item.selectedMode === m ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'"
                            class="flex-1 py-1.5 rounded text-sm transition">
                            {{ m }}
                        </button>
                    </div>

                    <!-- 負荷調整（重量/心拍など） -->
                    <div v-if="item.loadLabel" class="flex items-center justify-between bg-slate-900/60 p-2 rounded-lg">
                        <span class="text-xs text-slate-400 pl-1">{{ item.loadLabel }}</span>
                        <div class="flex items-center gap-3">
                            <button @click="item.load = Math.max(0, item.load - 5)"
                                class="w-10 h-10 bg-slate-700 active:bg-slate-600 rounded text-xl font-bold flex items-center justify-center">-</button>
                            <span class="font-mono text-lg font-bold w-12 text-center">{{ item.load }}</span>
                            <button @click="item.load += 5"
                                class="w-10 h-10 bg-slate-700 active:bg-slate-600 rounded text-xl font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>

                    <!-- 量調整（回数/時間など） -->
                    <div v-if="item.volumeLabel"
                        class="flex items-center justify-between bg-slate-900/60 p-2 rounded-lg">
                        <span class="text-xs text-slate-400 pl-1">{{ item.volumeLabel }}</span>
                        <div class="flex items-center gap-3">
                            <button @click="item.volume = Math.max(0, item.volume - 1)"
                                class="w-10 h-10 bg-slate-700 active:bg-slate-600 rounded text-xl font-bold flex items-center justify-center">-</button>
                            <span class="font-mono text-lg font-bold w-12 text-center">{{ item.volume }}</span>
                            <button @click="item.volume += 1"
                                class="w-10 h-10 bg-slate-700 active:bg-slate-600 rounded text-xl font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 送信フッター（固定） -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-slate-950/80 backdrop-blur border-t border-slate-800">
            <div class="max-w-md mx-auto">
                <button @click="submit" :disabled="saving || loading"
                    class="w-full py-4 bg-amber-400 active:bg-amber-500 disabled:bg-slate-700 text-slate-950 font-black rounded-xl text-lg shadow-lg transition">
                    {{ saving ? '送信中...' : '記録を保存する' }}
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const items = ref([]);
                const loading = ref(true);
                const saving = ref(false);

                onMounted(() => {
                    google.script.run
                        .withSuccessHandler(data => {
                            items.value = data;
                            loading.value = false;
                        })
                        .getInitialData();
                });

                const submit = () => {
                    const target = items.value.filter(i => i.active);
                    if (target.length === 0) return alert('記録対象がありません');

                    saving.value = true;
                    google.script.run
                        .withSuccessHandler(() => {
                            saving.value = false;
                            alert('保存完了！お疲れさん！');
                        })
                        .saveLogs(target);
                };

                return { items, loading, saving, submit };
            }
        }).mount('#app');
    </script>
</body>

</html>
