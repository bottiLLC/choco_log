[project]
name = "choco-log"
version = "0.1.0"
description = "Workout logging and visualization dashboard powered by Streamlit and SQLite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.66.0",
    "pandas>=2.2.0",
    "altair>=5.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["EXE002", "E402"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --cov=. --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
